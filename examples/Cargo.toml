[package]
name = "riode-examples"
version = "0.2.0"
license = "GPL-3.0"
readme = "README.md"
edition = "2021"
publish = false
description = "Aurora interactive demos and showcases (release-style static binaries)"

# Explicit targets only: each `<name>/view.rs` is the hot-reload source
# (mounted by the generative `riode-hot-gen-ui` crate), not a binary.
autoexamples = false

[dependencies]
riode = { path = "../crates/core/riode", version = "0.2.0" }
riode-engine-tiny-skia = { path = "../crates/engines/riode-engine-tiny-skia", version = "0.2.0" }
riode-engine-skia = { path = "../crates/engines/riode-engine-skia", version = "0.2.0" }
riode-engine-vello = { path = "../crates/engines/riode-engine-vello", version = "0.2.0" }
riode-engine-wgpu = { path = "../crates/engines/riode-engine-wgpu", version = "0.2.0" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
winit = { version = "0.29", default-features = false, features = ["rwh_06", "x11", "wayland"] }

[features]
default = ["os-clipboard"]
os-clipboard = ["riode/os-clipboard"]
tracy = ["riode/tracy"]

