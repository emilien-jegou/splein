[package]
name = "riode-hot-gen-ui"
version = "0.2.0"
edition = "2021"
publish = false
description = "Generative hot-reload UI (cdylib, dev only): one crate serving every example via RIODE_HOT_EXAMPLE"
license = "GPL-3.0"
readme = "README.md"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Single dynamic edge (see riode-shared docs): everything resolves to the host's one
# live runtime. No other riode-flavored dependencies, ever.
riode-shared = { path = "../../crates/core/riode-shared", version = "0.2.0" }
