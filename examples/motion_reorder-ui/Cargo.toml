[package]
name = "motion_reorder-ui"
version = "0.0.1-rc.1"
edition = "2021"
publish = false
description = "Hot-reloadable motion_reorder UI for aurora (cdylib, dev only)"
license = "GPL-3.0"
[lib]
crate-type = ["cdylib"]
[dependencies]
# Single dynamic edge (see aurora-shared docs): everything resolves to the host's one
# live runtime. No other aurora-flavored dependencies, ever.
aurora-shared = { path = "../../crates/aurora-shared", version = "0.0.1-rc.1" }
