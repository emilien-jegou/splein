[workspace]
resolver = "2"
members = ["crates/splein", "crates/aurora", "crates/aurora/macros", "crates/aurora-tiny-skia", "crates/aurora-vello", "crates/aurora-wayland", "crates/aurora-wgpu", "crates/aurora-quad", "crates/aurora/benches/bench_suite", "crates/aurora-hot-ui", "crates/aurora-shared", "crates/aurora-devkit-bin", "crates/aurora-cli", "examples/demo1-ui", "examples/demo2-ui", "examples/demo3-ui", "examples/motion_accordion-ui", "examples/motion_playback-ui", "examples/motion_imperative-ui", "examples/motion_interruption-ui", "examples/motion_layout_split-ui", "examples/motion_press-ui", "examples/motion_reorder-ui", "examples/motion_signals-ui", "examples/motion_transitions-ui", "examples/motion_validate-ui", "examples/selectable_text-ui", "examples/shadow_lab-ui", "examples/scroll_demo-ui", "examples/text_demo-ui", "examples/text_smooth-ui", "examples/wrap_repro-ui", "examples/view_demo-ui", "examples", "crates/probe-min"]

[workspace.dependencies]
smithay-client-toolkit = { version = "0.19", default-features = false }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# CLI & Logging
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tracing-error = "0.2"
tracing-flame = "0.2"
typed-builder = "0.20"
eyre = "0.6"
tokio = { version = "1.40", features = ["full"] }

# Rendering
tiny-skia = "0.11"
calloop = "0.13"
taffy = "0.5"
cosmic-text = "0.12"

