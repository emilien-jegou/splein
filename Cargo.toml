[workspace]
resolver = "2"
members = [
  "crates/core/riode",
  "crates/core/riode-shader",
  "crates/core/riode/macros",
  "examples/riode-hot-gen",
  "crates/core/riode-shared",
  "crates/engines/riode-engine-wgpu",
  "crates/tools/riode-cli",
  "plugins/riode-shader-glue",
  "examples",
]

# The purge target: everything that must compile for a demo to build and run.
# Platform/shim crates are parked out of the default set until they are needed.
default-members = [
  # TODO: Instead of two packages riode should re-export local macros
  "crates/core/riode-shader",
  "crates/core/riode",
  "crates/core/riode/macros",
  "crates/core/riode-shared",
  "crates/engines/riode-engine-wgpu",
  "crates/tools/riode-cli",
  "examples/riode-hot-gen",
  "examples",
]

[workspace.dependencies]
smithay-client-toolkit = { version = "0.19", default-features = false }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# CLI & Logging
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tracing-error = "0.2"
tracing-flame = "0.2"
typed-builder = "0.20"
eyre = "0.6"
tokio = { version = "1.40", features = ["full"] }

# Rendering
tiny-skia = "0.11"
calloop = "0.13"
taffy = "0.5"
cosmic-text = "0.12"

# Embedded size preset (S2 #11): optimize for flash footprint.
# Build with: cargo build --profile embedded -p riode --no-default-features
[profile.embedded]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
