[workspace]
resolver = "2"
members = ["crates/splein", "crates/riode", "crates/riode-skia", "crates/riode/macros", "crates/riode-tiny-skia", "crates/riode-vello", "crates/riode-wayland", "crates/riode-wgpu", "crates/riode-quad", "crates/riode/benches/bench_suite", "crates/riode-shared", "crates/riode-cli", "crates/riode-hot-gen", "examples", "crates/probe-min"]
default-members = ["crates/splein", "crates/riode", "crates/riode/macros", "crates/riode-tiny-skia", "crates/riode-vello", "crates/riode-wayland", "crates/riode-wgpu", "crates/riode-cli", "examples"]

[workspace.dependencies]
smithay-client-toolkit = { version = "0.19", default-features = false }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# CLI & Logging
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tracing-error = "0.2"
tracing-flame = "0.2"
typed-builder = "0.20"
eyre = "0.6"
tokio = { version = "1.40", features = ["full"] }

# Rendering
tiny-skia = "0.11"
calloop = "0.13"
taffy = "0.5"
cosmic-text = "0.12"

# Embedded size preset (S2 #11): optimize for flash footprint.
# Build with: cargo build --profile embedded -p riode --no-default-features
[profile.embedded]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
