[workspace]
resolver = "2"
members = [
  "apps/splein",
  "crates/core/riode",
  "crates/core/riode/benches/bench_suite",
  "crates/core/riode/macros",
  "examples/riode-hot-gen",
  "crates/core/riode-shared",
  "crates/engines/riode-engine-tiny-skia",
  "crates/engines/riode-engine-wgpu",
  "crates/platforms/riode-platform-android",
  "crates/platforms/riode-platform-ios",
  "crates/platforms/riode-platform-macos",
  "crates/platforms/riode-platform-wayland",
  "crates/platforms/riode-platform-windows",
  "crates/shims/riode-android",
  "crates/shims/riode-ios",
  "crates/shims/riode-macos",
  "crates/shims/riode-tiny-skia",
  "crates/shims/riode-wayland",
  "crates/shims/riode-wgpu",
  "crates/shims/riode-windows",
  "crates/tools/riode-cli",
  "examples",
]

default-members = [
  "apps/splein",
  # TODO: Instead of two packages riode should re-export local macros
  "crates/core/riode",
  "crates/core/riode/macros",
  "crates/engines/riode-engine-tiny-skia",
  "crates/engines/riode-engine-wgpu",
  "crates/platforms/riode-platform-android",
  "crates/platforms/riode-platform-ios",
  "crates/platforms/riode-platform-macos",
  "crates/platforms/riode-platform-wayland",
  "crates/platforms/riode-platform-windows",
  "crates/shims/riode-android",
  "crates/shims/riode-ios",
  "crates/shims/riode-macos",
  "crates/shims/riode-tiny-skia",
  "crates/shims/riode-wayland",
  "crates/shims/riode-wgpu",
  "crates/shims/riode-windows",
  "crates/tools/riode-cli",
  "examples"
]

[workspace.dependencies]
smithay-client-toolkit = { version = "0.19", default-features = false }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# CLI & Logging
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tracing-error = "0.2"
tracing-flame = "0.2"
typed-builder = "0.20"
eyre = "0.6"
tokio = { version = "1.40", features = ["full"] }

# Rendering
tiny-skia = "0.11"
calloop = "0.13"
taffy = "0.5"
cosmic-text = "0.12"

# Embedded size preset (S2 #11): optimize for flash footprint.
# Build with: cargo build --profile embedded -p riode --no-default-features
[profile.embedded]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
