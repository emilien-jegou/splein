[package]
name = "riode-android"
version = "0.0.1-rc.1"
edition = "2021"
publish = false
description = "Android host for riode"

[lib]
crate-type = ["cdylib"]

[dependencies]
riode = { path = "../riode" }
winit = { version = "0.29", default-features = false, features = ["android-game-activity", "rwh_06"] }
android-activity = { version = "0.6", features = ["game-activity"] }
android_logger = "0.13"
log = "0.4"

[features]
default = []
