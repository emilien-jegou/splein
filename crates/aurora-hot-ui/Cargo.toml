[package]
name = "aurora-hot-ui"
version = "0.0.1-rc.1"
edition = "2021"
publish = false
description = "Hot-reloadable demo UI for aurora (cdylib, dev only)"
license = "GPL-3.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Dynamic edge to the shared image: no aurora code is copied here (cargo links the
# dylib), so component bodies resolve hooks against the host's one live runtime.
aurora-shared = { path = "../aurora-shared", version = "0.0.1-rc.1" }
