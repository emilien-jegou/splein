[package]
name = "aurora-quad"
version = "0.0.1-rc.1"
edition = "2021"
description = "Single-window 2x2 combine backend for Aurora UI engine (all rasterizers side by side)"
license = "MIT"

[dependencies]
aurora = { path = "../aurora", version = "0.0.1-rc.1" }
aurora-tiny-skia = { path = "../aurora-tiny-skia", version = "0.0.1-rc.1" }
aurora-vello = { path = "../aurora-vello", version = "0.0.1-rc.1" }
aurora-wgpu = { path = "../aurora-wgpu", version = "0.0.1-rc.1" }
softbuffer = "0.4"
bytemuck = "1.16"
winit = { version = "0.29", default-features = false, features = ["rwh_06"] }
tiny-skia = "0.11"
pollster = "0.3"
tracing = "0.1"
