[package]
name = "riode-elements-macros"
version = "0.2.0"
edition = "2021"
publish = true
description = "Build-time asset baking macros for the Aurora UI element crate (include_svg!, include_image!, bake_src!)"
license = "GPL-3.0"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = "2"
parley = { version = "0.11", default-features = false, features = ["std"] }
swash = "0.2"
resvg = "0.42"
tiny-skia = "0.11"
image = { version = "0.25", default-features = true }

# Asset engine
maio = { path = "../../../maio/maio", version = "0.1.0" }
maio-core = { path = "../../../maio/maio-core", version = "0.1.0" }
serde = { workspace = true }
blake3 = { workspace = true }
