[package]
name = "bench_suite"
version = "0.2.0"
license = "GPL-3.0"
readme = "README.md"
edition = "2021"
description = "Criterion benchmark suite for Aurora core performance gates (ported from Martensite bench_suite)."
publish = false
autobins = false

[dependencies]
riode = { path = "../.." }
taffy = "0.5"

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
criterion = "0.5"
riode-engine-tiny-skia = { path = "../../../../engines/riode-engine-tiny-skia" }

[lib]
bench = false

[[bench]]
name = "bench_suite"
path = "src/main.rs"
harness = false
