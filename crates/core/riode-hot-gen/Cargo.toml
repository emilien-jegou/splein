[package]
name = "riode-hot-gen-ui"
version = "0.0.1-rc.1"
edition = "2021"
publish = true
description = "Generative hot-reload UI (cdylib, dev only): one crate serving every example via AURORA_HOT_EXAMPLE"
license = "GPL-3.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Single dynamic edge (see riode-shared docs): everything resolves to the host's one
# live runtime. No other riode-flavored dependencies, ever.
riode-shared = { path = "../riode-shared", version = "0.0.1-rc.1" }
