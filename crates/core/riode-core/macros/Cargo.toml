[package]
name = "riode-macros"
version = "0.2.0"
edition = "2021"
publish = true
description = "Engine-side view!/#[component] macros for the Aurora UI"
license = "GPL-3.0"
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
maio-core = { path = "../../../maio/maio-core", version = "0.1.0" }
maio = { path = "../../../maio/maio", version = "0.1.0" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
rstml = "0.12"
