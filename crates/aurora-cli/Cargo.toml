[package]
name = "aurora-cli"
version = "0.0.1-rc.1"
edition = "2021"
publish = false
description = "Aurora dev launcher: runs UI crates in hot-reload mode through the shared runtime"
license = "GPL-3.0"

[[bin]]
name = "aurora"
path = "src/main.rs"

[dependencies]
# Deliberately aurora-free (like hot-stub before it): linking any aurora crate here
# would embed a second runtime beside the shared image the UI dylibs resolve to.
# clap/libloading/libc are plain rlibs with no aurora in their closure — safe.
clap = { workspace = true }
libloading = "0.8"
libc = "0.2"
