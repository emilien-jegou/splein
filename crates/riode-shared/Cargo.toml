[package]
name = "riode-shared"
version = "0.0.1-rc.1"
edition = "2021"
publish = false
description = "Single shared riode runtime image for hot-reload hosts and UI libraries (dylib, dev only)"
license = "GPL-3.0"

[lib]
# Dynamic only: this image is the *only* riode code in hot-loop processes. The host
# dylib and every UI cdylib link it instead of embedding their own copies, so hooks,
# ambient stacks, epochs — and the backend rasterizers below — exist exactly once.
# Hot-loop crates depend on nothing else riode-flavored; see the module docs.
crate-type = ["dylib"]

[dependencies]
riode = { path = "../riode", version = "0.0.1-rc.1" }
riode-tiny-skia = { path = "../riode-tiny-skia", version = "0.0.1-rc.1" }
riode-skia = { path = "../riode-skia", version = "0.0.1-rc.1" }
riode-vello = { path = "../riode-vello", version = "0.0.1-rc.1" }
riode-wgpu = { path = "../riode-wgpu", version = "0.0.1-rc.1" }
