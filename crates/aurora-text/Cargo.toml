[package]
name = "aurora-text"
version = "0.0.1-rc.1"
edition = "2021"
publish = true
description = "Aurora UI engine: aurora-text (split from aurora facade)"
license = "GPL-3.0"

[dependencies]
aurora-foundation = { path = "../aurora-foundation", version = "0.0.1-rc.1" }
aurora-scene = { path = "../aurora-scene", version = "0.0.1-rc.1" }
parley = { version = "0.11", default-features = false, features = ["std"] }
swash = { version = "0.2" }
unicode-segmentation = "1.12"
rustc-hash = "2.1.3"
smallvec = "1.16.1"
tracing = "0.1"
