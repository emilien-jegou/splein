[package]
name = "aurora"
version = "0.0.1-rc.1"
edition = "2021"
publish = true
description = "Layout Engine"
license = "GPL-3.0"

[features]
default = ["vello"]
tracy = ["dep:tracy-client", "dep:tracing-tracy"]
vello = ["dep:vello", "dep:wgpu", "dep:pollster"]

[dependencies]
cosmic-text = { version = "0.12", default-features = false, features = ["std", "swash"] }
tiny-skia = "0.11"
winit = { version = "0.29", default-features = false, features = ["rwh_06", "x11", "wayland"] }
softbuffer = "0.4"
resvg = "0.42"
bytemuck = { version = "1.25.2", features = ["derive"] }
sys-locale = "0.3.2"
rustc-hash = "2.1.3"
smallvec = "1.16.1"
bon = "3.3"

# GPU Backend
vello = { version = "0.2", optional = true }
wgpu = { version = "0.20", optional = true }
pollster = { version = "0.3", optional = true }

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "registry", "env-filter"] }
tracy-client = { version = "0.19", features = ["enable"], optional = true }
tracing-tracy = { version = "0.12", features = ["enable"], optional = true }

[profile.release]
debug = true
opt-level = 3

[[example]]
name = "demo1"
path = "examples/demo1.rs"

[[example]]
name = "demo2"
path = "examples/demo2.rs"

[[example]]
name = "demo3"
path = "examples/demo3/main.rs"

[[example]]
name = "moving"
path = "examples/moving.rs"
