[package]
name = "aurora-hot-gen-ui"
version = "0.0.1-rc.1"
edition = "2021"
publish = false
description = "Generative hot-reload UI (cdylib, dev only): one crate serving every example via AURORA_HOT_EXAMPLE"
license = "GPL-3.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Single dynamic edge (see aurora-shared docs): everything resolves to the host's one
# live runtime. No other aurora-flavored dependencies, ever.
aurora-shared = { path = "../aurora-shared", version = "0.0.1-rc.1" }
