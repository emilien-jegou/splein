[package]
name = "aurora-skia"
version = "0.0.1-rc.1"
edition = "2021"

[features]
default = ["desktop"]
desktop = ["aurora/desktop", "dep:winit", "dep:softbuffer", "dep:aurora-tiny-skia"]

[dependencies]
aurora = { path = "../aurora", version = "0.0.1-rc.1", default-features = false, features = ["desktop"] }
aurora-tiny-skia = { path = "../aurora-tiny-skia", version = "0.0.1-rc.1", optional = true }
softbuffer = { version = "0.4", optional = true }
winit = { version = "0.29", default-features = false, features = ["rwh_06", "x11", "wayland"], optional = true }
