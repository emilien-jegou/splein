[package]
name = "riode-engine-skia"
version = "0.2.0"
publish = true
edition = "2021"

[features]
default = ["desktop"]
desktop = ["riode/desktop", "dep:winit", "dep:softbuffer", "dep:riode-engine-tiny-skia"]

[dependencies]
riode = { path = "../../core/riode", version = "0.2.0", default-features = false, features = ["desktop"] }
riode-engine-tiny-skia = { path = "../riode-engine-tiny-skia", version = "0.2.0", optional = true }
softbuffer = { version = "0.4", optional = true }
winit = { version = "0.29", default-features = false, features = ["rwh_06", "x11", "wayland"], optional = true }
