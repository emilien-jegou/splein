[package]
name = "riode-engine-quad"
version = "0.0.1-rc.1"
publish = true
edition = "2021"
description = "Single-window 2x2 combine backend for Aurora UI engine (all rasterizers side by side)"
license = "MIT"

[dependencies]
riode = { path = "../../core/riode", version = "0.0.1-rc.1" }
riode-engine-tiny-skia = { path = "../riode-engine-tiny-skia", version = "0.0.1-rc.1" }
riode-engine-vello = { path = "../riode-engine-vello", version = "0.0.1-rc.1" }
riode-engine-wgpu = { path = "../riode-engine-wgpu", version = "0.0.1-rc.1" }
softbuffer = "0.4"
bytemuck = "1.16"
winit = { version = "0.29", default-features = false, features = ["rwh_06"] }
tiny-skia = "0.11"
pollster = "0.3"
tracing = "0.1"
